<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraforming Mars Elite</title>
    <style>
        body { 
            margin: 0; 
            background: radial-gradient(circle at center, #0c0c1e 0%, #05050f 100%); 
            color: white; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px 0; 
            box-sizing: border-box; 
            min-height: 100vh; 
            position: relative; 
            user-select: none;
            overflow-x: hidden;
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            opacity: 0.4;
            z-index: 1;
            pointer-events: none;
        }
        
        .top-panel { width: 90%; max-width: 360px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; z-index: 100; }
        .fps-counter { background: rgba(0, 0, 0, 0.6); color: #00ffcc; font-family: monospace; font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid #1e293b; pointer-events: none; box-shadow: 0 0 10px rgba(0,255,204,0.1); }
        .lang-switch { display: flex; gap: 4px; }
        .lang-btn { background: rgba(21, 21, 37, 0.7); border: 1px solid #2d3748; color: #a0aec0; padding: 4px 7px; border-radius: 6px; font-size: 11px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .lang-btn.active { background: #00ffcc; color: #020208; border-color: #00ffcc; box-shadow: 0 0 12px rgba(0,255,204,0.4); }
        
        .header { text-align: center; margin-bottom: 5px; z-index: 10; }
        h2 { margin: 0; color: #ff6347; font-size: 22px; text-shadow: 0 0 15px rgba(255,99,71,0.3); letter-spacing: 0.5px; }
        .score { font-size: 20px; margin-top: 3px; color: #00ffcc; font-weight: bold; text-shadow: 0 0 10px rgba(0,255,204,0.2); }
        
        .space { position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; margin-bottom: 10px; z-index: 10; }
        
        .mars { 
            position: absolute; 
            width: 155px; 
            height: 155px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, #cc4422 0%, #882208 70%, #220500 100%); 
            box-shadow: 0 0 30px rgba(204,68,34,0.4); 
            transition: background 1.2s ease, box-shadow 1.2s ease, transform 0.1s ease; 
            overflow: hidden; 
        }
        .mars::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 30% 25%, rgba(0,0,0,0.25) 8%, transparent 12%),
                radial-gradient(circle at 75% 40%, rgba(0,0,0,0.2) 14%, transparent 20%),
                radial-gradient(circle at 45% 70%, rgba(0,0,0,0.3) 18%, transparent 25%),
                radial-gradient(circle at 15% 60%, rgba(0,0,0,0.15) 10%, transparent 15%),
                linear-gradient(to bottom, transparent 10%, rgba(0,0,0,0.3) 90%);
            opacity: 0.6;
            mix-blend-mode: multiply;
        }
        .mars::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.15) 0%, transparent 60%, rgba(0,0,0,0.7) 90%);
        }
        .mars:active { transform: scale(0.96); }
        
        .comet-effect { position: absolute; width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 15px #00ffff; animation: implode 0.4s ease-out forwards; pointer-events: none; }
        @keyframes implode { 0% { transform: scale(2.5); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }

        .controls { width: 88%; max-width: 360px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
        
        .progress-bar-container { background: rgba(10, 10, 20, 0.8); border: 1px solid #2d3748; height: 16px; border-radius: 8px; overflow: hidden; position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ff5533, #3a7d7a, #00ffcc, #00ff66); transition: width 0.4s ease-out; }
        .progress-text { position: absolute; width: 100%; text-align: center; font-size: 11px; line-height: 16px; font-weight: bold; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

        .btn { background: rgba(20, 24, 45, 0.85); border: 1px solid #2e3856; padding: 10px 14px; border-radius: 10px; color: #e2e8f0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; font-size: 13px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn:hover:not(:disabled) { border-color: #4d6199; background: rgba(28, 34, 64, 0.9); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: rgba(10, 10, 18, 0.6); color: #4a5568; border-color: #1a202c; cursor: not-allowed; box-shadow: none; }
        .btn .cost { color: #00ffcc; font-weight: bold; text-shadow: 0 0 5px rgba(0,255,204,0.2); }
        
        .reset-btn { background: none; border: none; color: #4a5568; font-size: 11px; cursor: pointer; text-decoration: underline; margin-top: 4px; transition: color 0.2s; }
        .reset-btn:hover { color: #a0aec0; }
    </style>
</head>
<body>

    <div class="top-panel">
        <div class="fps-counter" id="fps">FPS: --</div>
        <div class="lang-switch">
            <button class="lang-btn" id="lang-ua" onclick="changeLang('ua')">UA</button>
            <button class="lang-btn" id="lang-en" onclick="changeLang('en')">EN</button>
            <button class="lang-btn" id="lang-es" onclick="changeLang('es')">ES</button>
            <button class="lang-btn" id="lang-ru" onclick="changeLang('ru')">RU</button>
        </div>
    </div>

    <div class="header">
        <h2 id="game-title">Тераформування Марса</h2>
        <div class="score" id="score">0 BTU</div>
    </div>

    <div class="space" id="space" onclick="clickMars(event)">
        <div class="mars" id="mars"></div>
    </div>

    <div class="controls">
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">Придатність: 0%</div>
        </div>

        <button class="btn" id="upg1" onclick="buyUpgrade(1)" disabled>
            <span id="upg1-text">🧲 Магнітний щит</span>
            <span class="cost" id="cost1">15 BTU</span>
        </button>
        <button class="btn" id="upg2" onclick="buyUpgrade(2)" disabled>
            <span>🏭 <span id="upg2-text">Фаб-заводи атмосфери</span></span>
            <span class="cost" id="cost2">50 BTU</span>
        </button>
        <button class="btn" id="upg3" onclick="buyUpgrade(3)" disabled>
            <span id="upg3-text">🌱 Посів земного моху</span>
            <span class="cost" id="cost3">150 BTU</span>
        </button>
        
        <center><button class="reset-btn" id="reset-text" onclick="resetGame()">Почати заново 🔄</button></center>
    </div>

    <script>
        const i18n = {
            ua: {
                title: "Тераформування Марса", progress: "Придатність", done: "Марс повністю тераформовано! 🌍",
                upg1: "🧲 Магнітний щит", upg2: "Фаб-заводи атмосфери", upg3: "🌱 Посів земного моху",
                reset: "Почати заново 🔄", confirm: "Скинути прогрес гри?"
            },
            en: {
                title: "Terraforming Mars", progress: "Habitability", done: "Mars fully Terraformed! 🌍",
                upg1: "🧲 Magnetic Shield", upg2: "Atmosphere Factories", upg3: "🌱 Earth Moss Seeding",
                reset: "Reset Game 🔄", confirm: "Reset game progress?"
            },
            es: {
                title: "Terraformación de Marte", progress: "Habitabilidad", done: "¡Marte totalmente terraformado! 🌍",
                upg1: "🧲 Escudo Magnético", upg2: "Fábricas de Atmósfera", upg3: "🌱 Siembra de Musgo Terrestre",
                reset: "Reiniciar Juego 🔄", confirm: "¿Restablecer el progreso del juego?"
            },
            ru: {
                title: "Терраформирование Марса", progress: "Пригодность", done: "Марс полностью терраформирован! 🌍",
                upg1: "🧲 Магнитный щит", upg2: "Фаб-заводы атмосферы", upg3: "🌱 Посев земного мха",
                reset: "Начать заново 🔄", confirm: "Сбросить прогресс игры?"
            }
        };

        let currentLang = localStorage.getItem('m_lang') || 'ua';
        let btu = Number(localStorage.getItem('m_btu')) || 0;
        let terraformProgress = Number(localStorage.getItem('m_prog')) || 0;
        let clickPower = Number(localStorage.getItem('m_pow')) || 1;
        let passiveRate = Number(localStorage.getItem('m_rate')) || 0;
        let isVictoryPlayed = localStorage.getItem('m_vic') === 'true';

        let upgCosts = { 1: 15, 2: 50, 3: 150 };
        if (localStorage.getItem('m_costs')) {
            upgCosts = JSON.parse(localStorage.getItem('m_costs'));
        }

        const scoreEl = document.getElementById('score');
        const progressText = document.getElementById('progressText');
        const progressBar = document.getElementById('progressBar');
        const mars = document.getElementById('mars');
        const fpsEl = document.getElementById('fps');

        // ЗВУКОВИЙ РУШІЙ (Web Audio API)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } 
                else if (type === 'upgrade') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.setValueAtTime(450, now + 0.08);
                    osc.frequency.setValueAtTime(600, now + 0.16);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } 
                else if (type === 'victory') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.15); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.3); // G5
                    osc.frequency.setValueAtTime(1046.50, now + 0.45); // C6
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.8);
                    osc.start(now);
                    osc.stop(now + 0.8);
                }
            } catch (e) {
                console.log("Аудіо заблоковано браузером до першого кліку");
            }
        }

        let lastCalledTime;
        let fpsQueue = [];
        function countFPS() {
            if (!lastCalledTime) {
                lastCalledTime = performance.now();
                requestAnimationFrame(countFPS);
                return;
            }
            let delta = (performance.now() - lastCalledTime) / 1000;
            lastCalledTime = performance.now();
            let currentFps = Math.round(1 / delta);
            fpsQueue.push(currentFps);
            if (fpsQueue.length > 10) fpsQueue.shift();
            let averageFps = Math.round(fpsQueue.reduce((a, b) => a + b, 0) / fpsQueue.length);
            fpsEl.innerText = `FPS: ${averageFps}`;
            requestAnimationFrame(countFPS);
        }
        requestAnimationFrame(countFPS);

        setInterval(() => {
            if (passiveRate > 0 && terraformProgress < 100) {
                terraformProgress += passiveRate;
                if (terraformProgress >= 100) {
                    terraformProgress = 100;
                    if (!isVictoryPlayed) {
                        playSound('victory');
                        isVictoryPlayed = true;
                        localStorage.setItem('m_vic', 'true');
                    }
                }
                localStorage.setItem('m_prog', terraformProgress);
                updateUI();
                updatePlanetVisuals();
            }
        }, 1000);

        function saveGame() {
            localStorage.setItem('m_btu', btu);
            localStorage.setItem('m_prog', terraformProgress);
            localStorage.setItem('m_pow', clickPower);
            localStorage.setItem('m_rate', passiveRate);
            localStorage.setItem('m_costs', JSON.stringify(upgCosts));
            localStorage.setItem('m_lang', currentLang);
        }

        function changeLang(lang) {
            initAudio();
            currentLang = lang;
            saveGame();
            updateUI();
        }

        function clickMars(e) {
            playSound('click');
            btu += clickPower;
            
            const space = document.getElementById('space');
            const rect = space.getBoundingClientRect();
            const effect = document.createElement('div');
            effect.className = 'comet-effect';
            effect.style.left = `${e.clientX - rect.left - 6}px`;
            effect.style.top = `${e.clientY - rect.top - 6}px`;
            space.appendChild(effect);
            setTimeout(() => effect.remove(), 400);

            saveGame();
            updateUI();
        }

        function buyUpgrade(id) {
            if (btu >= upgCosts[id]) {
                playSound('upgrade');
                btu -= upgCosts[id];
                if (id === 1) { clickPower += 1; passiveRate += 0.02; }
                if (id === 2) { clickPower += 2; passiveRate += 0.06; }
                if (id === 3) { clickPower += 5; passiveRate += 0.15; }
                upgCosts[id] = Math.round(upgCosts[id] * 1.7);
                saveGame();
                updateUI();
                updatePlanetVisuals();
            }
        }

        function updateUI() {
            const t = i18n[currentLang];
            document.getElementById('game-title').innerText = t.title;
            document.getElementById('upg1-text').innerText = t.upg1;
            document.getElementById('upg2-text').innerText = t.upg2;
            document.getElementById('upg3-text').innerText = t.upg3;
            document.getElementById('reset-text').innerText = t.reset;

            ['ua', 'en', 'es', 'ru'].forEach(lang => {
                document.getElementById(`lang-${lang}`).className = `lang-btn ${currentLang === lang ? 'active' : ''}`;
            });

            scoreEl.innerText = `${btu} BTU`;
            
            let displayProgress = Math.floor(terraformProgress);
            if (terraformProgress >= 100) {
                progressText.innerText = t.done;
                progressText.style.color = "#00ff66";
            } else {
                progressText.innerText = `${t.progress}: ${displayProgress}%`;
                progressText.style.color = "#fff";
            }
            progressBar.style.width = `${terraformProgress}%`;

            for (let id in upgCosts) {
                const btn = document.getElementById(`upg${id}`);
                const costEl = document.getElementById(`cost${id}`);
                costEl.innerText = `${upgCosts[id]} BTU`;
                btn.disabled = btu < upgCosts[id] || terraformProgress >= 100;
            }
        }

        function updatePlanetVisuals() {
            if (terraformProgress <= 12) {
                mars.style.background = "linear-gradient(135deg, #cc4422 0%, #882208 70%, #220500 100%)";
                mars.style.boxShadow = "0 0 25px rgba(204, 68, 34, 0.4)";
            } 
            else if (terraformProgress > 12 && terraformProgress <= 28) {
                mars.style.background = "linear-gradient(135deg, #d95336 0%, #882208 70%, #1a0400 100%)";
                mars.style.boxShadow = "0 0 30px rgba(0, 150, 255, 0.45)";
            } 
            else if (terraformProgress > 28 && terraformProgress <= 45) {
                mars.style.background = "linear-gradient(135deg, #e67359 0%, #a63a24 50%, #405873 90%)";
                mars.style.boxShadow = "0 0 35px rgba(100, 180, 255, 0.55)";
            } 
            else if (terraformProgress > 45 && terraformProgress <= 62) {
                mars.style.background = "linear-gradient(135deg, #b84d33 0%, #4a7599 40%, #22405c 80%, #0d1a26 100%)";
                mars.style.boxShadow = "0 0 38px rgba(0, 160, 255, 0.65)";
            } 
            else if (terraformProgress > 62 && terraformProgress <= 78) {
                mars.style.background = "linear-gradient(135deg, #8c5842 0%, #3d7a63 30%, #1d4d6b 70%, #091924 100%)";
                mars.style.boxShadow = "0 0 40px rgba(0, 200, 255, 0.7)";
            } 
            else if (terraformProgress > 78 && terraformProgress < 100) {
                mars.style.background = "linear-gradient(135deg, #528c5a 0%, #2b6141 40%, #163e54 80%, #05141c 100%)";
                mars.style.boxShadow = "0 0 42px rgba(50, 255, 150, 0.75)";
            } 
            else if (terraformProgress >= 100) {
                mars.style.background = "linear-gradient(135deg, #4cb050 0%, #8bc34a 35%, #2196f3 70%, #0d1b2a 100%)";
                mars.style.boxShadow = "0 0 50px rgba(100, 255, 100, 0.9), inset -10px -10px 25px rgba(255, 255, 255, 0.25)";
            }
        }

        function resetGame() {
            if(confirm(i18n[currentLang].confirm)) {
                localStorage.clear();
                btu = 0; terraformProgress = 0; clickPower = 1; passiveRate = 0; isVictoryPlayed = false;
                upgCosts = { 1: 15, 2: 50, 3: 150 };
                saveGame(); updateUI(); updatePlanetVisuals();
            }
        }

        updateUI();
        updatePlanetVisuals();
    </script>
</body>
</html>
